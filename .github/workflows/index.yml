name: Validate and index profiles

on:
  push:
    branches: [main]
    paths: ["profiles/**", "scripts/**"]
  pull_request:
    paths: ["profiles/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-index.py --check

  index:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-index.py
      - name: Commit index.json
        run: |
          git config user.name "openghub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: regenerate index.json"
          git push
